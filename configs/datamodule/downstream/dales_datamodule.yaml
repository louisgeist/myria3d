_target_: myria3d.pctl.datamodule.downstream.DownstreamNpyDatamodule

data_root: ${oc.env:DOWNSTREAM_DATA_ROOT,/data/geist/Pointcept/data}/dales
dataset_target: myria3d.pctl.dataset.downstream.dales.DalesDataset

train_dir: train
# DALES has no val split upstream (train/test only) -- val mirrors test, a documented
# convention (see readme_linear_probing.md), not a silently-mislabeled held-out set.
val_dir: test
test_dir: test

# Confirmed on JZ (2026-09-18): DALES was preprocessed with preprocess_dales.py's
# own default `--chunking 3` (an earlier internal note wrongly documented 4 -- see
# README_geist.md in the sibling Pointcept repo, now corrected). Raw DALES tiles are
# ~500m square (measured directly off a source PLY), so a chunking factor of 3 makes
# each on-disk scene folder ~166.7m square. tile_width is set a bit above that
# nominal value as a safety margin against per-file bbox variance (chunking splits
# each file's own point bounding box, not a fixed global grid) -- underestimating it
# would silently drop real boundary points from every mosaic subtile. With
# subtile_width=50 (the Flair3D+ pretraining scale, same convention as ECLAIR/H3D),
# SubtileCrop now performs a real 4x4 mosaic crop instead of the previous
# tile_width==subtile_width no-op.
tile_width: 170
subtile_width: 50

pre_filter:
  _target_: functools.partial
  _args_:
    - "${get_method:myria3d.pctl.dataset.utils.pre_filter_below_n_points}"
  min_num_nodes: 1

batch_size: 12
num_workers: 4
prefetch_factor: 2

defaults:
  - transforms: downstream.yaml
