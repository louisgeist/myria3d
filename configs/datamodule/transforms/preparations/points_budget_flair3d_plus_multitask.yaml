# Preparations for Flair3D+ multitask (100 m tiles cropped to 50 m subtiles on the fly).
# 50m to reproduce myria3d pipeline.
voxel: 0.1

# Val/test mosaic, deliberately larger than the train crop (datamodule.tile_width/
# subtile_width = 100/50). Pointcept patches are ~102.4 x 102.5 m and tile each ROI with no
# overlap; a 100/50 mosaic (anchored at the patch's min corner) leaves the east/north ~2.5 m
# strip of every patch unpredicted and unscored -> NaN cuts every ~102 m in the stitched ROI
# raster that collapse APLS G->G'. 104/52 still yields 4 quadrants (keep the same
# tile/subtile ratio as the datamodule: it sizes the eval subtile_index range) and covers
# the whole patch. See readme_flair3d.md (APLS).
eval_tile_width: 104
eval_subtile_width: 52

# Per-point id/label keys that must survive voxel downsampling by point-picking, not
# PyG's default mean-reduce (which silently float-casts them) -- see CategoricalGridSampling.
nathab_categorical_keys:
  - forest_2d_cell_id
  - y_forest_2d
  - roads_cell_id
  - y_roads
  - y_nathab_habitat_type
  - y_nathab_moisture_regime
  - y_nathab_soil_chemistry
  - y_nathab_bioclimatic_zone

train:
  SubtileCrop:
    _target_: myria3d.pctl.transforms.transforms.SubtileCrop
    tile_width: "${datamodule.tile_width}"
    subtile_width: "${datamodule.subtile_width}"
    random: true
    # Skip a randomly-drawn 50 m quadrant that is (near-)empty even though its 100 m tile
    # is fine -- coastline / swath-edge tiles. Below 300 GridSampling + MinimumNumNodes
    # only duplicate points into a junk sample. Replaces the tile-level too_small filter.
    min_points: 300

  DropPointsByClass:
    _target_: myria3d.pctl.transforms.transforms.DropPointsByClass

  GridSampling:
    _target_: myria3d.pctl.transforms.transforms.CategoricalGridSampling
    size: ${datamodule.transforms.preparations.voxel}
    categorical_keys: ${datamodule.transforms.preparations.nathab_categorical_keys}

  MinimumNumNodes:
    _target_: myria3d.pctl.transforms.transforms.MinimumNumNodes
    _args_:
      - 300

  MaximumNumNodes:
    _target_: myria3d.pctl.transforms.transforms.MaximumNumNodes
    _args_:
      - 40000

  Center:
    _target_: torch_geometric.transforms.Center

  NullifyLowestZ:
    _target_: myria3d.pctl.transforms.transforms.NullifyLowestZ

  ZRandomOffset:
    _target_: myria3d.pctl.transforms.transforms.ZRandomOffset
    std: 0.1

eval:
  SubtileCrop:
    _target_: myria3d.pctl.transforms.transforms.SubtileCrop
    tile_width: ${datamodule.transforms.preparations.eval_tile_width}
    subtile_width: ${datamodule.transforms.preparations.eval_subtile_width}
    random: false

  DropPointsByClass:
    _target_: myria3d.pctl.transforms.transforms.DropPointsByClass

  CopyFullPos:
    _target_: myria3d.pctl.transforms.transforms.CopyFullPos

  CopyFullPreparedTargets:
    _target_: myria3d.pctl.transforms.transforms.CopyFullPreparedTargets

  GridSampling:
    _target_: myria3d.pctl.transforms.transforms.CategoricalGridSampling
    size: ${datamodule.transforms.preparations.voxel}
    categorical_keys: ${datamodule.transforms.preparations.nathab_categorical_keys}

  MinimumNumNodes:
    _target_: myria3d.pctl.transforms.transforms.MinimumNumNodes
    _args_:
      - 300

  MaximumNumNodes:
    _target_: myria3d.pctl.transforms.transforms.MaximumNumNodes
    _args_:
      - 40000

  CopySampledPos:
    _target_: myria3d.pctl.transforms.transforms.CopySampledPos

  Center:
    _target_: torch_geometric.transforms.Center

  NullifyLowestZ:
    _target_: myria3d.pctl.transforms.transforms.NullifyLowestZ

predict:
  DropPointsByClass:
    _target_: myria3d.pctl.transforms.transforms.DropPointsByClass

  CopyFullPos:
    _target_: myria3d.pctl.transforms.transforms.CopyFullPos

  GridSampling:
    _target_: myria3d.pctl.transforms.transforms.CategoricalGridSampling
    size: ${datamodule.transforms.preparations.voxel}
    categorical_keys: ${datamodule.transforms.preparations.nathab_categorical_keys}

  MinimumNumNodes:
    _target_: myria3d.pctl.transforms.transforms.MinimumNumNodes
    _args_:
      - 300

  MaximumNumNodes:
    _target_: myria3d.pctl.transforms.transforms.MaximumNumNodes
    _args_:
      - 40000

  CopySampledPos:
    _target_: myria3d.pctl.transforms.transforms.CopySampledPos

  Center:
    _target_: torch_geometric.transforms.Center

  NullifyLowestZ:
    _target_: myria3d.pctl.transforms.transforms.NullifyLowestZ
