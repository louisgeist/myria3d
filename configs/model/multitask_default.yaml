_target_: myria3d.models.multitask_model.MultiTaskModel

d_in: ${dataset_description.d_in}
num_classes: ${dataset_description.num_classes}
classification_dict: ${dataset_description.classification_dict}

task_configs: ${dataset_description.task_configs}
task_weights: ${dataset_description.task_weights}
main_task: ${dataset_description.main_task}
elevation_target_scale: ${dataset_description.elevation_target_scale}

ckpt_path: null
neural_net_class_name: ???
neural_net_hparams: ???

interpolation_k: ${predict.interpolator.interpolation_k}
num_workers: 4
# When false, metrics use subsampled points (no CPU knn_interpolate).
interpolate_at_val: false
interpolate_at_test: true

momentum: 0.9
monitor: "val/iou"

# GradNorm-lite: EMA-based rescaling of per-task losses by 1/EMA(last-layer grad norm).
# See readme_flair3d.md#loss-balancing-gradnorm-lite. Off by default, opt in per-experiment.
grad_norm_lite: false
grad_norm_lite_interval: 100
grad_norm_lite_ema_alpha: 0.1
grad_norm_lite_eps: 1e-3
grad_norm_lite_task_groups: {}
# Diagnostic-only per-task gradient norm / cosine-similarity logging (no effect on training).
log_task_gradient_norms: false

criteria:
  segment:
    _target_: torch.nn.CrossEntropyLoss
    ignore_index: 15
    weight:
      _target_: torch.FloatTensor
      _args_:
        - ${dataset_description.class_weights}
  forest:
    _target_: torch.nn.CrossEntropyLoss
    ignore_index: 2
  land_use:
    _target_: torch.nn.CrossEntropyLoss
    ignore_index: 10
  natural_habitat:
    _target_: torch.nn.CrossEntropyLoss
    ignore_index: 11
  elevation:
    _target_: torch.nn.SmoothL1Loss
    beta: 0.01

defaults:
  - optimizer: Adam.yaml
  - lr_scheduler: ReduceLROnPlateau.yaml
