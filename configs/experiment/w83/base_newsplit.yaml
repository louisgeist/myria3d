# @package _global_

defaults:
  - w80/base_w80.yaml

dataset_description:
    classification_dict: {0: "Building", 1: "Greenhouse", 2: "Impervious surface", 3: "Other soil", 4: "Herbaceous", 5: "Vineyard", 6: "Tree", 7: "Brushwood",8: "Aerial Building", 9: "Void",}

datamodule:
  split_csv_path: "${hydra:runtime.cwd}/tests/data/flair3d_split_1902.csv"
  transforms:
    preparations:

      voxel: [0.5,0.5,0.1]
      y_definition: inter_finerall5

model:
  num_classes: 10

  criterion:
    ignore_index: 9 # = num_classes_spt = num_classes_myria3d -1
# dataset_description:
#   num_classes: 9

# split1902 : we changed the split of 4 NAGs
logger:
  wandb:
    name: >
      RandLaNet | split1902| label=${datamodule.transforms.preparations.y_definition} | 
      voxel=${datamodule.transforms.preparations.voxel}