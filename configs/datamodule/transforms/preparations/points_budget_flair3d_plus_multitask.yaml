# Preparations for Flair3D+ multitask (100 m tiles cropped to 50 m subtiles on the fly).
# 50m to reproduce myria3d pipeline.
voxel: 0.1

train:
  SubtileCrop:
    _target_: myria3d.pctl.transforms.transforms.SubtileCrop
    tile_width: "${datamodule.tile_width}"
    subtile_width: "${datamodule.subtile_width}"
    random: true
    # Skip a randomly-drawn 50 m quadrant that is (near-)empty even though its 100 m tile
    # is fine -- coastline / swath-edge tiles. Below 300 GridSampling + MinimumNumNodes
    # only duplicate points into a junk sample. Replaces the tile-level too_small filter.
    min_points: 300

  DropPointsByClass:
    _target_: myria3d.pctl.transforms.transforms.DropPointsByClass

  GridSampling:
    _target_: torch_geometric.transforms.GridSampling
    _args_:
      - ${datamodule.transforms.preparations.voxel}

  MinimumNumNodes:
    _target_: myria3d.pctl.transforms.transforms.MinimumNumNodes
    _args_:
      - 300

  MaximumNumNodes:
    _target_: myria3d.pctl.transforms.transforms.MaximumNumNodes
    _args_:
      - 40000

  Center:
    _target_: torch_geometric.transforms.Center

  NullifyLowestZ:
    _target_: myria3d.pctl.transforms.transforms.NullifyLowestZ

  ZRandomOffset:
    _target_: myria3d.pctl.transforms.transforms.ZRandomOffset
    std: 0.1

eval:
  SubtileCrop:
    _target_: myria3d.pctl.transforms.transforms.SubtileCrop
    tile_width: "${datamodule.tile_width}"
    subtile_width: "${datamodule.subtile_width}"
    random: false

  DropPointsByClass:
    _target_: myria3d.pctl.transforms.transforms.DropPointsByClass

  CopyFullPos:
    _target_: myria3d.pctl.transforms.transforms.CopyFullPos

  CopyFullPreparedTargets:
    _target_: myria3d.pctl.transforms.transforms.CopyFullPreparedTargets

  GridSampling:
    _target_: torch_geometric.transforms.GridSampling
    _args_:
      - ${datamodule.transforms.preparations.voxel}

  MinimumNumNodes:
    _target_: myria3d.pctl.transforms.transforms.MinimumNumNodes
    _args_:
      - 300

  MaximumNumNodes:
    _target_: myria3d.pctl.transforms.transforms.MaximumNumNodes
    _args_:
      - 40000

  CopySampledPos:
    _target_: myria3d.pctl.transforms.transforms.CopySampledPos

  Center:
    _target_: torch_geometric.transforms.Center

  NullifyLowestZ:
    _target_: myria3d.pctl.transforms.transforms.NullifyLowestZ

predict:
  DropPointsByClass:
    _target_: myria3d.pctl.transforms.transforms.DropPointsByClass

  CopyFullPos:
    _target_: myria3d.pctl.transforms.transforms.CopyFullPos

  GridSampling:
    _target_: torch_geometric.transforms.GridSampling
    _args_:
      - ${datamodule.transforms.preparations.voxel}

  MinimumNumNodes:
    _target_: myria3d.pctl.transforms.transforms.MinimumNumNodes
    _args_:
      - 300

  MaximumNumNodes:
    _target_: myria3d.pctl.transforms.transforms.MaximumNumNodes
    _args_:
      - 40000

  CopySampledPos:
    _target_: myria3d.pctl.transforms.transforms.CopySampledPos

  Center:
    _target_: torch_geometric.transforms.Center

  NullifyLowestZ:
    _target_: myria3d.pctl.transforms.transforms.NullifyLowestZ
