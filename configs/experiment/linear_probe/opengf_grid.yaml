# @package _global_
# OpenGF (ground filtering) linear probing -- grid phase: sweep the 12-value LR grid on
# a frozen Flair3D+ backbone, pick a winner by val mIoU (Ground / Non-ground). The test
# is "Test II w/o outliers" (scene T2, outliers deleted). Per-class IoU is logged too
# (val/probe_*/iou_ground). See readme_linear_probing.md.

defaults:
  - override /datamodule: downstream/opengf_datamodule.yaml
  - override /dataset_description: opengf.yaml
  - override /model: grid_probe/default.yaml
  - override /callbacks: grid_probe_grid.yaml
  - override /logger: wandb.yaml

callbacks:
  grid_probe_metrics:
    class_names: ${dataset_description.class_names}

logger:
  wandb:
    name: "GridProbe | OpenGF | grid phase"

trainer:
  accelerator: gpu
  max_epochs: 50
  check_val_every_n_epoch: 1
  log_every_n_steps: 50

datamodule:
  batch_size: 12
  num_workers: 4
