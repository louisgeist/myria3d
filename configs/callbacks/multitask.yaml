# Multitask callbacks: monitor val/iou on main semantic task (segment).

log_code:
  _target_: myria3d.callbacks.comet_callbacks.LogCode
  code_dir: ${work_dir}/myria3d

log_logs_dir:
  _target_: myria3d.callbacks.comet_callbacks.LogLogsPath

lr_monitor:
  _target_: pytorch_lightning.callbacks.LearningRateMonitor
  logging_interval: "step"
  log_momentum: true

model_checkpoint:
  _target_: pytorch_lightning.callbacks.ModelCheckpoint
  monitor: "val/iou"
  mode: "max"
  save_top_k: 1
  save_last: True
  verbose: True
  dirpath: "checkpoints/"
  filename: "epoch_{epoch:03d}"
  auto_insert_metric_name: False

early_stopping:
  _target_: pytorch_lightning.callbacks.EarlyStopping
  monitor: "val/iou"
  mode: "max"
  patience: 6
  min_delta: 0

multitask_metrics:
  _target_: myria3d.callbacks.multitask_metric_callbacks.MultiTaskMetrics
  task_configs: ${dataset_description.task_configs}
  main_task: ${dataset_description.main_task}
  elevation_target_scale: ${dataset_description.elevation_target_scale}
  classification_dict: ${dataset_description.classification_dict}
