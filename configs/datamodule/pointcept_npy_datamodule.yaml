_target_: myria3d.pctl.datamodule.pointcept_npy.PointceptNpyDatamodule

data_root: /data/geist/Pointcept/data/flair3d_plus
csv_manifest: ${datamodule.data_root}/raw/scene_split_manifest_D067.csv
excluded_tiles_details_csv: ${datamodule.data_root}/missing_coord_tiles.details.csv
# No too_small_tiles_manifest: a tile-level "< 1000 points" filter is the wrong
# granularity now that training crops one random 50 m quadrant per tile. Near-empty
# quadrants are dropped per-crop instead (SubtileCrop.min_points, see transforms/
# preparations/points_budget_flair3d_plus_multitask.yaml).

tile_width: 100
subtile_width: 50
# Cap the number of val tiles used per eval epoch (null = full val split). Set this in
# an experiment config to bound validation time on a large val split, mirroring the
# fixed-size val subset convention from the Pointcept-side training setup.
max_val_tiles: null
val_tiles_seed: 0
# Optional CSV pinning the val split to an exact patch_id list (e.g. Pointcept's own
# stratified subset manifest at `${datamodule.data_root}/manifests/val_dev_subset_2000.csv`
# -- 2000 tiles national on Jean Zay; a stale, D067-only 773-tile copy on Hecate). Takes
# priority over max_val_tiles when the file is found; falls back to max_val_tiles
# random sampling otherwise (with a warning), so this is safe to leave pointed at a
# path that doesn't exist on every machine.
val_tiles_manifest: null

pre_filter:
  _target_: functools.partial
  _args_:
    - "${get_method:myria3d.pctl.dataset.utils.pre_filter_below_n_points}"
  min_num_nodes: 1

batch_size: 12
num_workers: 4
prefetch_factor: 2

defaults:
  - transforms: default.yaml
